name: Build

"on":
  pull_request:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Download modules
        run: go mod download

      - name: Build panel
        run: go build -trimpath ./cmd/server

      - name: Build node-agent
        run: go build -trimpath ./cmd/node-agent

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Shellcheck release scripts
        run: |
          shellcheck scripts/release/*.sh scripts/mtls/*.sh
          scripts/release/lint_remote_bodies.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Download modules
        run: go mod download

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright's webServer boots the panel itself via `go run ./cmd/server`
      # on 127.0.0.1:18080 with a temp DB (see playwright.config.ts).
      - name: Run e2e
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

