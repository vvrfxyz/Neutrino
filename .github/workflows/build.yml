name: Build

"on":
  pull_request:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Download modules
        run: go mod download

      - name: Build panel
        run: go build -trimpath ./cmd/server

      - name: Build node-agent
        run: go build -trimpath ./cmd/node-agent

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Shellcheck release scripts
        run: |
          shellcheck scripts/release/*.sh
          scripts/release/lint_remote_bodies.sh

