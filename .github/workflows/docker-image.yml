name: Docker Image

"on":
  pull_request:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve panel image destinations
        id: panel_images
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: neutrino-panel
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_PANEL_IMAGE_VAR: ${{ vars.DOCKERHUB_PANEL_IMAGE }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${owner}/${IMAGE_NAME}"
          images="$ghcr_image"
          dockerhub_enabled="false"
          dockerhub_image=""

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            dockerhub_enabled="true"
            if [ -n "$DOCKERHUB_PANEL_IMAGE_VAR" ]; then
              dockerhub_image="$DOCKERHUB_PANEL_IMAGE_VAR"
            elif [ -n "$DOCKERHUB_IMAGE_VAR" ]; then
              dockerhub_image="$DOCKERHUB_IMAGE_VAR"
            else
              dockerhub_owner="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')"
              dockerhub_image="${dockerhub_owner}/${IMAGE_NAME}"
            fi
            images="${images}"$'\n'"${dockerhub_image}"
          fi

          echo "ghcr_image=${ghcr_image}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_enabled=${dockerhub_enabled}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${dockerhub_image}" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve node image destinations
        id: node_images
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: neutrino-node
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NODE_IMAGE_VAR: ${{ vars.DOCKERHUB_NODE_IMAGE }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${owner}/${IMAGE_NAME}"
          images="$ghcr_image"
          dockerhub_enabled="false"
          dockerhub_image=""

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            dockerhub_enabled="true"
            if [ -n "$DOCKERHUB_NODE_IMAGE_VAR" ]; then
              dockerhub_image="$DOCKERHUB_NODE_IMAGE_VAR"
            else
              dockerhub_owner="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')"
              dockerhub_image="${dockerhub_owner}/${IMAGE_NAME}"
            fi
            images="${images}"$'\n'"${dockerhub_image}"
          fi

          echo "ghcr_image=${ghcr_image}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_enabled=${dockerhub_enabled}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${dockerhub_image}" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Panel Docker metadata
        id: panel_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.panel_images.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Node Docker metadata
        id: node_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.node_images.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (steps.panel_images.outputs.dockerhub_enabled == 'true' || steps.node_images.outputs.dockerhub_enabled == 'true') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build panel image (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.panel_meta.outputs.tags }}
          labels: ${{ steps.panel_meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=neutrino-panel

      - name: Build node image (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node-agent/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.node_meta.outputs.tags }}
          labels: ${{ steps.node_meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=neutrino-node

      - name: Build and push panel image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.panel_meta.outputs.tags }}
          labels: ${{ steps.panel_meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=neutrino-panel
          cache-to: type=gha,mode=max,scope=neutrino-panel

      - name: Build and push node image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node-agent/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.node_meta.outputs.tags }}
          labels: ${{ steps.node_meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=neutrino-node
          cache-to: type=gha,mode=max,scope=neutrino-node

      - name: Summary
        env:
          PANEL_GHCR_IMAGE: ${{ steps.panel_images.outputs.ghcr_image }}
          PANEL_DOCKERHUB_IMAGE: ${{ steps.panel_images.outputs.dockerhub_image }}
          PANEL_TAGS: ${{ steps.panel_meta.outputs.tags }}
          NODE_GHCR_IMAGE: ${{ steps.node_images.outputs.ghcr_image }}
          NODE_DOCKERHUB_IMAGE: ${{ steps.node_images.outputs.dockerhub_image }}
          NODE_TAGS: ${{ steps.node_meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "Panel image destinations:"
            echo
            echo "- ${PANEL_GHCR_IMAGE}"
            if [ -n "$PANEL_DOCKERHUB_IMAGE" ]; then
              echo "- ${PANEL_DOCKERHUB_IMAGE}"
            fi
            echo
            echo "Panel tags:"
            echo "$PANEL_TAGS"
            echo
            echo "Node image destinations:"
            echo
            echo "- ${NODE_GHCR_IMAGE}"
            if [ -n "$NODE_DOCKERHUB_IMAGE" ]; then
              echo "- ${NODE_DOCKERHUB_IMAGE}"
            fi
            echo
            echo "Node tags:"
            echo "$NODE_TAGS"
            echo
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "PR build only; images were not pushed."
            else
              echo "Images were pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
