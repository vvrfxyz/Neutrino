name: Docker Image

"on":
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE_NAME: cli-proxy-api
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image destinations
        id: images
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${owner}/${IMAGE_NAME}"
          images="$ghcr_image"
          dockerhub_enabled="false"
          dockerhub_image=""

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            dockerhub_enabled="true"
            if [ -n "$DOCKERHUB_IMAGE_VAR" ]; then
              dockerhub_image="$DOCKERHUB_IMAGE_VAR"
            else
              dockerhub_owner="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')"
              dockerhub_image="${dockerhub_owner}/${IMAGE_NAME}"
            fi
            images="${images}"$'\n'"${dockerhub_image}"
          fi

          echo "ghcr_image=${ghcr_image}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_enabled=${dockerhub_enabled}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${dockerhub_image}" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && steps.images.outputs.dockerhub_enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cli-proxy-api

      - name: Build and push image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cli-proxy-api
          cache-to: type=gha,mode=max,scope=cli-proxy-api

      - name: Summary
        env:
          GHCR_IMAGE: ${{ steps.images.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ steps.images.outputs.dockerhub_image }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "Image destinations:"
            echo
            echo "- ${GHCR_IMAGE}"
            if [ -n "$DOCKERHUB_IMAGE" ]; then
              echo "- ${DOCKERHUB_IMAGE}"
            fi
            echo
            echo "Tags:"
            echo "$META_TAGS"
            echo
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "PR build only; images were not pushed."
            else
              echo "Images were pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
